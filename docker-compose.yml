services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: regdocs-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    container_name: regdocs-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Di dalam jaringan Compose, Qdrant dipanggil lewat NAMA SERVICE.
      # "localhost" di sini berarti container API itu sendiri, bukan Qdrant.
      # Nilai ini menimpa QDRANT_URL dari .env yang menunjuk localhost.
      QDRANT_URL: http://qdrant:6333
    volumes:
      # model fastembed 1,1 GB dan cache embedding: diunduh sekali, bertahan
      - api_cache:/app/.cache
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
  api_cache:
