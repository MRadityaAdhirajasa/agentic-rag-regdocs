name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy app scripts

      - name: Pytest
        run: uv run pytest

  eval-gate:
    runs-on: ubuntu-latest
    # Gerbang mutu retrieval. Jalan tanpa API key sama sekali: korpus datang
    # dari eval/korpus_fixture.jsonl dan pencariannya sparse-only (BM25),
    # yang dihitung di runner. Deterministik, gratis, dan tidak bisa kehabisan
    # kuota di tengah PR.
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION: regdocs_ci
      EMBED_CACHE_PATH: /tmp/embed_cache.sqlite
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Cache model fastembed
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bm25-v1

      - name: Ingest korpus beku
        run: uv run python -m scripts.ingest --fixture --reset
        env:
          FASTEMBED_CACHE_PATH: ~/.cache/fastembed

      - name: Eval gate
        run: uv run python -m scripts.eval_gate
        env:
          FASTEMBED_CACHE_PATH: ~/.cache/fastembed
